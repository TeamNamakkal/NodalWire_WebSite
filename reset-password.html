<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — NodalWire</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #040911;
    font-family: 'Inter', Arial, sans-serif;
    color: #eef4ff;
  }
  .rp-card {
    background: rgba(7, 16, 31, 0.95);
    border: 1px solid rgba(29, 120, 196, 0.22);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    width: 92%;
    max-width: 420px;
    padding: 32px;
  }
  h1 { font-family: 'Lato', sans-serif; font-size: 22px; margin: 0 0 8px; }
  p { font-size: 14px; color: #7a9bbf; line-height: 1.6; margin: 0 0 20px; }
  label { display: block; font-family: 'Lato', sans-serif; font-size: 11px; font-weight: 700; color: #1D78C4; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
  input {
    width: 100%;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: #eef4ff;
    outline: none;
    margin-bottom: 16px;
  }
  input:focus { border-color: #1D78C4; box-shadow: 0 0 0 3px rgba(29, 120, 196, 0.2); }
  button {
    width: 100%;
    background: linear-gradient(135deg, #1D78C4 0%, #1562a8 100%);
    color: #fff;
    font-family: 'Lato', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .rp-alert {
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .rp-alert.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); color: #fca5a5; }
  .rp-alert.success { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.25); color: #4ade80; }
  a { color: #1D78C4; }
</style>
</head>
<body>
  <div class="rp-card">
    <h1>Reset Your Password</h1>
    <p id="rpIntro">Enter a new password below.</p>
    <div class="rp-alert" id="rpAlert"></div>
    <form id="rpForm">
      <label for="rpNewPassword">New Password</label>
      <input id="rpNewPassword" type="password" required minlength="6" autocomplete="new-password">
      <label for="rpConfirmPassword">Confirm Password</label>
      <input id="rpConfirmPassword" type="password" required minlength="6" autocomplete="new-password">
      <button type="submit" id="rpSubmitBtn">Reset Password</button>
    </form>
    <p style="margin-top: 16px;"><a href="/index.html">Back to home</a></p>
  </div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const alertBox = document.getElementById('rpAlert');
  const form = document.getElementById('rpForm');

  function showAlert(message, type) {
    alertBox.innerText = message;
    alertBox.className = 'rp-alert ' + type;
    alertBox.style.display = 'block';
  }

  if (!token) {
    showAlert('This reset link is missing a token. Please request a new one from the login screen.', 'error');
    form.style.display = 'none';
    return;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const newPassword = document.getElementById('rpNewPassword').value;
    const confirmPassword = document.getElementById('rpConfirmPassword').value;

    if (newPassword !== confirmPassword) {
      showAlert('Passwords do not match.', 'error');
      return;
    }
    if (newPassword.length < 6) {
      showAlert('Password must be at least 6 characters.', 'error');
      return;
    }

    const submitBtn = document.getElementById('rpSubmitBtn');
    submitBtn.disabled = true;

    try {
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });
      const data = await res.json();
      if (data.success) {
        showAlert(data.message || 'Password updated successfully. You can now log in.', 'success');
        form.style.display = 'none';
      } else {
        showAlert(data.message || 'Failed to reset password.', 'error');
        submitBtn.disabled = false;
      }
    } catch (err) {
      showAlert('Network error. Please try again.', 'error');
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
